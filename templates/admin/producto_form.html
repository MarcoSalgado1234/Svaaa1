{% extends 'base.html' %}
{% block title %}{{ 'Nuevo' if nuevo else 'Editar' }} producto{% endblock %}
{% block content %}
<div class="container" style="padding-bottom:3rem">
  <div class="page-head" style="padding-bottom:0"><h1>{{ 'Nuevo producto' if nuevo else 'Editar producto' }}</h1></div>
  {% include 'admin/_nav.html' %}
  <form method="post" class="panel">
    <div class="form-grid">
      <div class="full"><label class="f">Nombre</label><input name="nombre" required value="{{ p.nombre or '' }}"></div>
      <div><label class="f">Marca</label><select name="id_marca">{% for m in marcas %}<option value="{{ m.id_marca }}" {{ 'selected' if p.id_marca|string==m.id_marca|string }}>{{ m.nombre }}</option>{% endfor %}</select></div>
      <div><label class="f">Categoría</label><select name="id_categoria">{% for c in categorias %}<option value="{{ c.id_categoria }}" {{ 'selected' if p.id_categoria|string==c.id_categoria|string }}>{{ c.nombre }}</option>{% endfor %}</select></div>
      <div><label class="f">Origen</label><select name="id_origen">{% for o in origenes %}<option value="{{ o.id_origen }}" {{ 'selected' if p.id_origen|string==o.id_origen|string }}>{{ o.nombre }}</option>{% endfor %}</select></div>
      <div><label class="f">Presentación</label><input name="presentacion" required value="{{ p.presentacion or '' }}" placeholder="Botella 355 ml"></div>
      <div><label class="f">Graduación (° GL)</label><input type="number" step="0.1" min="0" name="graduacion" value="{{ p.graduacion or 0 }}"></div>
      <div><label class="f">Emoji</label><input name="emoji" maxlength="4" value="{{ p.emoji or '🍺' }}"></div>
      <div class="full"><label class="f">Descripción</label><textarea name="descripcion" rows="3">{{ p.descripcion or '' }}</textarea></div>
      <div><label class="f">Precio pieza</label><input type="number" step="0.01" min="0" name="precio" required value="{{ p.precio or '' }}"></div>
      <div><label class="f">Piezas por caja</label><input type="number" min="1" name="piezas_por_caja" required value="{{ p.piezas_por_caja or 12 }}"></div>
      <div><label class="f">Precio caja</label><input type="number" step="0.01" min="0" name="precio_caja" required value="{{ p.precio_caja or '' }}"></div>
      <div><label class="f">Precio caja mayoreo (3+)</label><input type="number" step="0.01" min="0" name="precio_caja_mayoreo" required value="{{ p.precio_caja_mayoreo or '' }}"></div>
      <div><label class="f">Existencia (piezas)</label><input type="number" min="0" name="stock" value="{{ p.stock or 0 }}"></div>
      <div><label class="f">Stock mínimo (alerta)</label><input type="number" min="0" name="stock_minimo" value="{{ p.stock_minimo or 24 }}"></div>
    </div>
    <div class="checks">
      <label><input type="checkbox" name="es_artesanal" {{ 'checked' if p.es_artesanal }}> Producto artesanal</label>
      <label><input type="checkbox" name="activo" {{ 'checked' if p.activo }}> Visible en el catálogo</label>
    </div>
    <button class="btn mt">Guardar</button> <a class="btn btn-outline mt" href="{{ url_for('admin_productos') }}">Cancelar</a>
  </form>
</div>
{% endblock %}
